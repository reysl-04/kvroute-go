# deploy/compose.yaml — 4 simulator workers + Prometheus + Grafana
# Run from the repo root:  docker compose -f deploy/compose.yaml up -d
# Relative paths below resolve against this file's folder (deploy/), not your shell's.

name: kvroute                             # project name; containers become kvroute-w1-1 ... (default would be "deploy")

x-sim-worker: &sim-worker                 # x- = ignored by compose; &sim-worker = YAML anchor, reused by w1–w4
  image: ghcr.io/llm-d/llm-d-inference-sim:v0.10.2  # pinned; ghcr.io is where llm-d publishes (a bare name would look on Docker Hub)
  command: ["--config", "/cfg/profile.yaml"]        # arguments to the image's entrypoint, /app/llm-d-inference-sim
  volumes:
    - ./sim:/cfg:ro                       # deploy/sim on the host -> /cfg in the container, read-only

services:
  w1:
    <<: *sim-worker                       # merge the shared definition above, so workers can't drift apart
    environment:
      POD_IP: w1                          # required when enable-kvcache is on; only used in the KV-event topic name
    ports:
      - "8001:8000"                       # host:container; quoted so YAML can't misread digits:digits as a number

  w2:
    <<: *sim-worker
    environment:
      POD_IP: w2
    ports:
      - "8002:8000"

  w3:
    <<: *sim-worker
    environment:
      POD_IP: w3
    ports:
      - "8003:8000"

  w4:
    <<: *sim-worker
    environment:
      POD_IP: w4
    ports:
      - "8004:8000"

  prometheus:
    image: prom/prometheus:v3.13.4        # pinned; 3.13 is the current LTS line
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro  # the path the image's default command reads
    ports:
      - "9090:9090"                       # UI and query API at http://localhost:9090
    depends_on: [w1, w2, w3, w4]          # start order only; it does not wait for the workers to be ready

  grafana:
    image: grafana/grafana:13.2.3         # pinned; Grafana tags have no "v"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro  # data source only; no dashboards
    ports:
      - "3000:3000"                       # UI at http://localhost:3000 (first login admin / admin)
    depends_on: [prometheus]
